<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing you in… — TKSR Payroll</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); padding: 20px;
    }
    .box {
      background: #fff; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.25);
      padding: 32px; width: 100%; max-width: 420px; text-align: center;
    }
    .box h1 { font-size: 18px; margin-bottom: 8px; }
    .box p { color: #64748b; font-size: 14px; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 16px; border-radius: 50%;
      border: 4px solid #e2e8f0; border-top-color: #1d4ed8; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .done { font-size: 26px; margin-bottom: 8px; }
    .error { font-size: 26px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <div id="state"><div class="spinner"></div><h1>Completing sign in…</h1></div>
    <div id="result" class="hidden">
      <div class="done">&#10003;</div>
      <h1>You're signed in</h1>
      <p>Redirecting you to the app…</p>
    </div>
    <div id="errorBox" class="hidden">
      <div class="error">&#9888;</div>
      <h1>Sign in failed</h1>
      <p id="errMsg"></p>
    </div>
  </div>

  <script>
    var API_BASE = "https://tksr-payroll-api.pushpinderjob.workers.dev";
    var TOKEN_KEY = "payroll_token";
    var USER_KEY = "payroll_user";

    function show(msg, failed) {
      document.getElementById("state").classList.add("hidden");
      if (failed) {
        document.getElementById("errMsg").textContent = msg;
        document.getElementById("errorBox").classList.remove("hidden");
      } else {
        document.getElementById("result").classList.remove("hidden");
        setTimeout(function () { location.replace("index.html"); }, 900);
      }
    }

    (async function () {
      var params = new URLSearchParams(location.search);
      var oauthError = params.get("error");
      var code = params.get("code");
      var state = params.get("state");
      var saved = null;
      try { saved = JSON.parse(sessionStorage.getItem("gstate") || "null"); } catch (e) { saved = null; }
      sessionStorage.removeItem("gstate");

      if (oauthError) return show("Sign in was cancelled or denied. Please try again.", true);
      if (!code || !saved || !state || saved.state !== state) {
        return show("This sign-in link is invalid or expired. Please try again.", true);
      }

      try {
        var res = await fetch(API_BASE + "/api/auth/google/token", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ code: code, redirect_uri: saved.redirect_uri, code_verifier: saved.verifier })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || ("Sign in failed (" + res.status + ")"));
        localStorage.setItem(TOKEN_KEY, data.token);
        localStorage.setItem(USER_KEY, JSON.stringify(data.user));
        show();
      } catch (e) {
        show("Sign in failed: " + e.message, true);
      }
    })();
  </script>
</body>
</html>
