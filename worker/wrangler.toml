name = "tksr-payroll-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The JWT signing secret. Set a strong random value with:
#   npx wrangler secret put JWT_SECRET
# (do not commit a real secret here)

# Optional: enable "Sign in with Google".
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   GOOGLE_REDIRECT_URI must match exactly what is registered in Google Console.
[vars]
GOOGLE_CLIENT_ID = "678365536626-2ago6n13j2a71e36jp0gi33gj2jfr30f.apps.googleusercontent.com"
GOOGLE_REDIRECT_URI = "https://tksr-payroll-api.pushpinderjob.workers.dev/api/auth/google/callback"

[[d1_databases]]
binding = "DB"
database_name = "tksr-payroll"
database_id = "7dbd3f1d-c273-4c1f-ac21-9765a8ba70ce"
